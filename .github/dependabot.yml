version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Tooling majors are taken one at a time, by hand, after a full e2e run.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
